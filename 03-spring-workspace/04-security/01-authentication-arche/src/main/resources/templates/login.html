<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<title>Login</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

	<div class="bg-white p-8 rounded-lg shadow-md max-w-sm w-full">
		
		<h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Sign In</h2>
		
		<div th:if="${param.error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm text-center">
			Invalid Username or Password!
		</div>
		
		<form th:action="@{/login}" method="post" class="space-y-4">
		
			<div>
				<label class="block text-gray-700 text-sm font-bold mb-2">Username</label>
				<input type="text" name="username" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" >
			</div>
		
			<div>
				<label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
				<input type="password" name="password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" >
			</div>
			
			<button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200">
				Login
			</button>

		</form>
		
		<div class="mt-4 text-center">
			<a th:href="@{/}" class="text-sm text-blue-500 hover:underline">Back to Home</a>
		</div>
		
	</div>

</body>
</html>
